name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/streaming-toggle
    tags:
      - 'streaming-toggle-*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: packages/opencode

      - name: Build Windows x64 exe
        run: bun run ./script/build.ts --single
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: "0.0.0-streaming-toggle"
          OPENCODE_RELEASE: ""

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64
          path: packages/opencode/dist/opencode-windows-x64/bin/opencode.exe
          if-no-files-found: warn

      - name: Upload to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/streaming-toggle-')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/opencode/dist/opencode-windows-x64/bin/opencode.exe
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
